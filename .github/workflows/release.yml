name: Release

# Manual release: creates the git tag and the GitHub release in one step.
# Tag pushes are the only thing this needs elevated rights for, so the work
# happens here rather than from a developer machine.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.5.1"
        required: true
        type: string
      target:
        description: "Commit SHA to tag (defaults to the head of the selected branch)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inputs are passed through the environment, never interpolated into the
      # shell, so a crafted tag cannot inject commands.
      - name: Resolve target commit
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
        run: |
          sha="${TARGET:-$GITHUB_SHA}"
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::error::Target commit $sha does not exist in this repository."
            exit 1
          fi
          echo "sha=$(git rev-parse "$sha")" >> "$GITHUB_OUTPUT"

      # Everything below (version check, bundle build, release notes) must come
      # from the commit being tagged, not from the branch head.
      - name: Check out the target commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: git checkout --quiet "$SHA"

      - name: Check tag matches the packaged version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="${TAG#v}"
          have="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG implies version $want but pyproject.toml says $have."
            exit 1
          fi
          bundle="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "$want" != "$bundle" ]; then
            echo "::error::Tag $TAG implies version $want but manifest.json says $bundle."
            exit 1
          fi
          echo "Version check passed: $have"

      # The Claude Desktop extension (.mcpb) is a zip of manifest.json,
      # pyproject.toml, uv.lock and the package. Dependencies are not vendored:
      # the uv server type lets Claude Desktop install them on first start, and
      # the lockfile pins what it installs.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lock dependencies for the bundle
        run: uv lock

      - name: Set up Node.js (for the mcpb CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Claude Desktop extension
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2 pack . "dist/research-mcp-${TAG}.mcpb"
          npx --yes @anthropic-ai/mcpb@2 info "dist/research-mcp-${TAG}.mcpb"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          notes="docs/releases/${TAG}.md"
          args=(release create "$TAG" --target "$SHA" --title "research-mcp $TAG")
          if [ -f "$notes" ]; then
            echo "Using release notes from $notes"
            args+=(--notes-file "$notes")
          else
            echo "No $notes found; generating notes from commit history."
            args+=(--generate-notes)
          fi
          # Attach the extension bundle as a release asset.
          args+=("dist/research-mcp-${TAG}.mcpb")
          gh "${args[@]}"
